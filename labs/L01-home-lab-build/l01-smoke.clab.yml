name: l01-smoke

topology:
  nodes:
    n1:
      kind: linux
      image: alpine:latest
      exec:
        - ip addr add 10.0.0.1/30 dev eth1
    n2:
      kind: linux
      image: alpine:latest
      exec:
        - ip addr add 10.0.0.2/30 dev eth1
  links:
    - endpoints: ["n1:eth1", "n2:eth1"]
